<!DOCTYPE html><html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>KURWA CHAT</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f4f7;
}

.header{
    background:#075e54;
    color:white;
    padding:20px;
    text-align:center;
}

.header h1{
    font-size:28px;
}

.header p{
    margin-top:5px;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.card h2{
    margin-bottom:15px;
    color:#075e54;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#075e54;
    color:white;
    font-size:16px;
    font-weight:bold;
}

button.secondary{
    background:#128c7e;
    margin-top:10px;
}

.hidden{
    display:none;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:8px;
    background:#eef7f5;
    color:#075e54;
}

.footer{
    text-align:center;
    margin-top:30px;
    padding:20px;
    color:#777;
}
</style></head><body><div class="header">
    <h1>💬 KURWA CHAT</h1>
    <p>Wasiliana na watu kwa urahisi</p>
</div><div class="container"><!-- LOGIN -->
<div class="card" id="loginBox">

    <h2>Ingia KURWA CHAT</h2>

    <input
        type="email"
        id="loginEmail"
        placeholder="Email yako"
    >

    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
    >

    <button onclick="login()">
        INGIA
    </button>

    <button class="secondary" onclick="showRegister()">
        JISAJILI
    </button>

    <div id="loginMessage" class="message hidden"></div>

</div>


<!-- REGISTER -->
<div class="card hidden" id="registerBox">

    <h2>Jisajili KURWA CHAT</h2>

    <input
        type="text"
        id="registerName"
        placeholder="Jina lako"
    >

    <input
        type="email"
        id="registerEmail"
        placeholder="Email yako"
    >

    <input
        type="password"
        id="registerPassword"
        placeholder="Password"
    >

    <button onclick="register()">
        JISAJILI
    </button>

    <button class="secondary" onclick="showLogin()">
        RUDI LOGIN
    </button>

    <div id="registerMessage" class="message hidden"></div>

</div>


<!-- HOME -->
<div class="card hidden" id="homeBox">

    <h2>Karibu KURWA CHAT 🎉</h2>

    <p id="userName"></p>

    <br>

    <div class="message">
        💬 Chat na marafiki
    </div>

    <div class="message">
        👥 Jiunge na Groups
    </div>

    <div class="message">
        📸 Tuma picha
    </div>

    <div class="message">
        🔔 Notifications
    </div>

    <br>

    <button onclick="logout()">
        TOKA
    </button>

</div>

</div><div class="footer">
    © 2026 KURWA CHAT
</div><script>

// ===============================
// SUPABASE CONNECTION
// ===============================

const SUPABASE_URL =
"https://qodxnlrfxdtqpvctmczw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XVyOJC_mXkCs1wCXd0mIHQ_l-kKaV02";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ===============================
// REGISTER
// ===============================

async function register(){

    const name =
        document.getElementById("registerName").value.trim();

    const email =
        document.getElementById("registerEmail").value.trim();

    const password =
        document.getElementById("registerPassword").value;

    const message =
        document.getElementById("registerMessage");

    if(!name || !email || !password){

        showMessage(
            message,
            "Jaza taarifa zote."
        );

        return;
    }

    if(password.length < 6){

        showMessage(
            message,
            "Password iwe na angalau characters 6."
        );

        return;
    }

    const {data,error} =
        await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options:{
                data:{
                    full_name:name
                }
            }
        });

    if(error){

        showMessage(
            message,
            error.message
        );

        return;
    }

    showMessage(
        message,
        "Usajili umefanikiwa! Sasa unaweza kuingia."
    );

    setTimeout(() => {
        showLogin();
    },1500);
}


// ===============================
// LOGIN
// ===============================

async function login(){

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const message =
        document.getElementById("loginMessage");

    if(!email || !password){

        showMessage(
            message,
            "Weka email na password."
        );

        return;
    }

    const {data,error} =
        await supabaseClient.auth.signInWithPassword({
            email:email,
            password:password
        });

    if(error){

        showMessage(
            message,
            error.message
        );

        return;
    }

    showHome(data.user);
}


// ===============================
// SHOW HOME
// ===============================

function showHome(user){

    document
        .getElementById("loginBox")
        .classList.add("hidden");

    document
        .getElementById("registerBox")
        .classList.add("hidden");

    document
        .getElementById("homeBox")
        .classList.remove("hidden");

    const name =
        user.user_metadata?.full_name ||
        user.email;

    document
        .getElementById("userName")
        .innerText =
        "Umeingia kama: " + name;
}


// ===============================
// LOGOUT
// ===============================

async function logout(){

    await supabaseClient.auth.signOut();

    showLogin();
}


// ===============================
// SHOW REGISTER
// ===============================

function showRegister(){

    document
        .getElementById("loginBox")
        .classList.add("hidden");

    document
        .getElementById("registerBox")
        .classList.remove("hidden");

}


// ===============================
// SHOW LOGIN
// ===============================

function showLogin(){

    document
        .getElementById("registerBox")
        .classList.add("hidden");

    document
        .getElementById("homeBox")
        .classList.add("hidden");

    document
        .getElementById("loginBox")
        .classList.remove("hidden");
}


// ===============================
// MESSAGE
// ===============================

function showMessage(element,text){

    element.innerText = text;

    element.classList.remove("hidden");

}


// ===============================
// CHECK EXISTING LOGIN
// ===============================

async function checkUser(){

    const {data} =
        await supabaseClient.auth.getSession();

    if(data.session){

        showHome(data.session.user);

    }

}

checkUser();

</script></body>
</html>
