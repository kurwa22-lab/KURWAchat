<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KURWA CHAT</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f4f7;
}

.header{
    background:#075e54;
    color:white;
    padding:20px;
    text-align:center;
}

.header h1{
    font-size:28px;
}

.header p{
    margin-top:5px;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.card h2{
    margin-bottom:15px;
    color:#075e54;
}

input,select{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
    background:white;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#075e54;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button.secondary{
    background:#128c7e;
    margin-top:10px;
}

.hidden{
    display:none;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:8px;
    background:#eef7f5;
    color:#075e54;
}

.footer{
    text-align:center;
    margin-top:30px;
    padding:20px;
    color:#777;
}
</style>
</head>

<body>

<div class="header">
    <h1>💬 KURWA CHAT</h1>
    <p>Wasiliana na watu kwa urahisi</p>
</div>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginBox">

    <h2>Ingia KURWA CHAT</h2>

    <input
        type="tel"
        id="loginPhone"
        placeholder="Namba ya simu mfano 766972508"
    >

    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
    >

    <button onclick="login()">
        ANZA LOGIN 🚀
    </button>

    <button class="secondary" onclick="showRegister()">
        JISAJILI
    </button>

    <div id="loginMessage" class="message hidden"></div>

</div>


<!-- REGISTER -->
<div class="card hidden" id="registerBox">

    <h2>Jisajili KURWA CHAT</h2>

    <input
        type="text"
        id="registerName"
        placeholder="Username"
    >

    <select id="countryCode">
        <option value="+255">🇹🇿 Tanzania +255</option>
        <option value="+254">🇰🇪 Kenya +254</option>
        <option value="+256">🇺🇬 Uganda +256</option>
        <option value="+250">🇷🇼 Rwanda +250</option>
        <option value="+257">🇧🇮 Burundi +257</option>
        <option value="+1">🇺🇸 USA +1</option>
        <option value="+44">🇬🇧 UK +44</option>
        <option value="+91">🇮🇳 India +91</option>
        <option value="+27">🇿🇦 South Africa +27</option>
        <option value="+971">🇦🇪 UAE +971</option>
    </select>

    <input
        type="tel"
        id="registerPhone"
        placeholder="Namba ya simu bila +255"
    >

    <input
        type="password"
        id="registerPassword"
        placeholder="Password"
    >

    <input
        type="password"
        id="registerPassword2"
        placeholder="Rudia Password"
    >

    <button onclick="register()">
        JISAJILI 🚀
    </button>

    <button class="secondary" onclick="showLogin()">
        RUDI LOGIN
    </button>

    <div id="registerMessage" class="message hidden"></div>

</div>


<!-- HOME -->
<div class="card hidden" id="homeBox">

    <h2>Karibu KURWA CHAT 🎉</h2>

    <p id="userName"></p>

    <br>

    <div class="message">
        💬 Chat na marafiki
    </div>

    <div class="message">
        👥 Jiunge na Groups
    </div>

    <div class="message">
        📸 Tuma picha
    </div>

    <div class="message">
        🔔 Notifications
    </div>

    <div class="message">
        🔍 Tafuta watu
    </div>

    <br>

    <button onclick="logout()">
        TOKA
    </button>

</div>

</div>

<div class="footer">
    © 2026 KURWA CHAT
</div>


<script>

// ===============================
// SUPABASE
// ===============================

const SUPABASE_URL =
"https://qodxnlrfxdtqpvctmczw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XVyOJC_mXkCs1wCXd0mIHQ_l-kKaV02";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ===============================
// CREATE INTERNAL EMAIL
// ===============================

function createLoginEmail(phone){

    return phone.replace(/\D/g,"") + "@kurwachat.local";

}


// ===============================
// REGISTER
// ===============================

async function register(){

    const username =
        document.getElementById("registerName")
        .value.trim();

    const countryCode =
        document.getElementById("countryCode")
        .value;

    let phone =
        document.getElementById("registerPhone")
        .value.trim();

    const password =
        document.getElementById("registerPassword")
        .value;

    const password2 =
        document.getElementById("registerPassword2")
        .value;

    const message =
        document.getElementById("registerMessage");


    if(!username || !phone || !password || !password2){

        showMessage(
            message,
            "Jaza taarifa zote."
        );

        return;
    }


    phone = phone.replace(/\s+/g,"");


    if(phone.startsWith("+")){

        phone = phone.substring(1);

    }


    if(phone.startsWith("0")){

        phone = phone.substring(1);

    }


    const fullPhone =
        countryCode + phone;


    if(password.length < 6){

        showMessage(
            message,
            "Password iwe na angalau characters 6."
        );

        return;
    }


    if(password !== password2){

        showMessage(
            message,
            "Password mbili hazifanani."
        );

        return;
    }


    if(username.length < 3){

        showMessage(
            message,
            "Username iwe na angalau herufi 3."
        );

        return;
    }


    const loginEmail =
        createLoginEmail(fullPhone);


    showMessage(
        message,
        "Inatengeneza akaunti..."
    );


    const {data,error} =
        await supabaseClient.auth.signUp({

            email:loginEmail,

            password:password,

            options:{
                data:{
                    username:username,
                    phone:fullPhone,
                    country_code:countryCode
                }
            }

        });


    if(error){

        showMessage(
            message,
            "Usajili umeshindikana: " + error.message
        );

        return;
    }


    if(!data.user){

        showMessage(
            message,
            "Imeshindikana kupata akaunti."
        );

        return;
    }


    const {error:profileError} =
        await supabaseClient
        .from("profiles")
        .insert({

            id:data.user.id,

            username:username,

            phone:fullPhone,

            country_code:countryCode

        });


    if(profileError){

        showMessage(
            message,
            "Akaunti imetengenezwa lakini profile haijahifadhiwa: "
            + profileError.message
        );

        return;
    }


    showMessage(
        message,
        "Usajili umefanikiwa! 🎉"
    );


    setTimeout(() => {

        showLogin();

    },1500);

}


// ===============================
// LOGIN
// ===============================

async function login(){

    let phone =
        document.getElementById("loginPhone")
        .value.trim();

    const password =
        document.getElementById("loginPassword")
        .value;

    const message =
        document.getElementById("loginMessage");


    if(!phone || !password){

        showMessage(
            message,
            "Weka namba ya simu na password."
        );

        return;
    }


    phone = phone.replace(/\s+/g,"");


    if(phone.startsWith("+")){

        phone = phone.substring(1);

    }


    if(phone.startsWith("0")){

        phone = "255" + phone.substring(1);

    }


    const loginEmail =
        createLoginEmail("+" + phone);


    const {data,error} =
        await supabaseClient.auth.signInWithPassword({

            email:loginEmail,

            password:password

        });


    if(error){

        showMessage(
            message,
            "Namba au password sio sahihi."
        );

        return;
    }


    showHome(data.user);

}


// ===============================
// HOME
// ===============================

function showHome(user){

    document
    .getElementById("loginBox")
    .classList.add("hidden");


    document
    .getElementById("registerBox")
    .classList.add("hidden");


    document
    .getElementById("homeBox")
    .classList.remove("hidden");


    const username =
        user.user_metadata?.username ||
        "Mtumiaji";


    document
    .getElementById("userName")
    .innerText =
        "Umeingia kama: @" + username;

}


// ===============================
// LOGOUT
// ===============================

async function logout(){

    await supabaseClient.auth.signOut();

    showLogin();

}


// ===============================
// SHOW REGISTER
// ===============================

function showRegister(){

    document
    .getElementById("loginBox")
    .classList.add("hidden");


    document
    .getElementById("registerBox")
    .classList.remove("hidden");

}


// ===============================
// SHOW LOGIN
// ===============================

function showLogin(){

    document
    .getElementById("registerBox")
    .classList.add("hidden");


    document
    .getElementById("homeBox")
    .classList.add("hidden");


    document
    .getElementById("loginBox")
    .classList.remove("hidden");

}


// ===============================
// MESSAGE
// ===============================

function showMessage(element,text){

    element.innerText = text;

    element.classList.remove("hidden");

}


// ===============================
// CHECK LOGIN
// ===============================

async function checkUser(){

    const {data} =
        await supabaseClient.auth.getSession();


    if(data.session){

        showHome(data.session.user);

    }

}


checkUser();

</script>

</body>
</html>
