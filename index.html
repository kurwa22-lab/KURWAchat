<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KURWA CHAT</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f3f6;
  color:#222;
}
.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:white;
}
.header{
  background:#075e54;
  color:white;
  padding:18px;
  font-size:23px;
  font-weight:bold;
}
.card{
  padding:20px;
}
input,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}
button{
  background:#075e54;
  color:white;
  border:none;
  font-weight:bold;
}
button.secondary{
  background:#128c7e;
}
.hidden{display:none}
.error{color:#c00;margin:8px 0}
.success{color:green;margin:8px 0}
.tabs{
  display:flex;
  gap:5px;
  margin-bottom:10px;
}
.tabs button{margin:0}
.chat{
  height:60vh;
  overflow-y:auto;
  padding:12px;
  background:#efeae2;
}
.msg{
  max-width:80%;
  padding:9px 12px;
  margin:7px 0;
  border-radius:10px;
  background:white;
}
.me{
  margin-left:auto;
  background:#d9fdd3;
}
.small{
  font-size:12px;
  color:#777;
}
.logout{
  background:#d32f2f;
}
</style>
</head>

<body>

<div class="app">

<div class="header">💬 KURWA CHAT</div>

<!-- LOGIN / REGISTER -->
<div id="auth" class="card">

  <div class="tabs">
    <button onclick="showLogin()">LOGIN</button>
    <button class="secondary" onclick="showRegister()">JISAJILI</button>
  </div>

  <div id="loginBox">
    <h2>Ingia KURWA CHAT</h2>

    <input id="loginUsername" placeholder="Username">

    <input id="loginPassword"
           type="password"
           placeholder="Password">

    <button onclick="login()">INGIA</button>

    <div id="loginMessage"></div>
  </div>

  <div id="registerBox" class="hidden">
    <h2>Jisajili</h2>

    <input id="regUsername" placeholder="Username">

    <input id="regCountry"
           placeholder="Country code mfano +255"
           value="+255">

    <input id="regPhone"
           placeholder="Namba ya simu">

    <input id="regPassword"
           type="password"
           placeholder="Password">

    <input id="regPassword2"
           type="password"
           placeholder="Rudia password">

    <button onclick="register()">JISAJILI</button>

    <div id="registerMessage"></div>
  </div>

</div>

<!-- CHAT -->
<div id="chatApp" class="hidden">

  <div class="card">
    <div>
      Umeingia kama:
      <b id="currentUser"></b>
    </div>

    <button class="logout" onclick="logout()">TOKA</button>

    <hr>

    <input id="receiverUsername"
           placeholder="Username ya unayetaka kumtumia">

    <button onclick="startChat()">FUNGUA CHAT</button>
  </div>

  <div id="chatArea" class="chat"></div>

  <div class="card">
    <input id="messageInput"
           placeholder="Andika ujumbe...">

    <button onclick="sendMessage()">TUMA</button>

    <div id="chatMessage"></div>
  </div>

</div>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://qodxnlrfxdtqpvctmczw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XVyOJC_mXkCs1wCXd0mIHQ_l-kKaV02";

const supabase =
createClient(SUPABASE_URL, SUPABASE_KEY);


/* =========================
   VARIABLES
========================= */

let currentProfile = null;
let currentReceiver = null;


/* =========================
   AUTH SCREENS
========================= */

window.showLogin = function(){

  document.getElementById("loginBox")
  .classList.remove("hidden");

  document.getElementById("registerBox")
  .classList.add("hidden");

};


window.showRegister = function(){

  document.getElementById("registerBox")
  .classList.remove("hidden");

  document.getElementById("loginBox")
  .classList.add("hidden");

};


/* =========================
   REGISTER
========================= */

window.register = async function(){

  const username =
    document.getElementById("regUsername").value.trim();

  const country =
    document.getElementById("regCountry").value.trim();

  const phone =
    document.getElementById("regPhone").value.trim();

  const password =
    document.getElementById("regPassword").value;

  const password2 =
    document.getElementById("regPassword2").value;

  const box =
    document.getElementById("registerMessage");

  box.innerHTML = "";

  if(!username || !phone || !password){

    box.innerHTML =
    '<div class="error">Jaza taarifa zote.</div>';

    return;
  }

  if(password !== password2){

    box.innerHTML =
    '<div class="error">Password hazifanani.</div>';

    return;
  }

  try{

    /* Angalia username kama ipo */

    const {data:existing,error:checkError} =
      await supabase
      .from("profiles")
      .select("id")
      .eq("username",username)
      .maybeSingle();

    if(checkError) throw checkError;

    if(existing){

      box.innerHTML =
      '<div class="error">Username hiyo tayari ipo.</div>';

      return;
    }

    /*
      Kwa sasa password inahifadhiwa kwenye
      browser localStorage.
      Hatua inayofuata tutahamisha authentication
      kwenda mfumo salama wa Supabase Auth.
    */

    const {data,error} =
      await supabase
      .from("profiles")
      .insert({
        username:username,
        phone:phone,
        country_code:country
      })
      .select()
      .single();

    if(error) throw error;

    localStorage.setItem(
      "kurwa_password_" + username,
      password
    );

    box.innerHTML =
    '<div class="success">Usajili umefanikiwa! Sasa ingia.</div>';

    document.getElementById("regUsername").value="";
    document.getElementById("regPhone").value="";
    document.getElementById("regPassword").value="";
    document.getElementById("regPassword2").value="";

    showLogin();

  }catch(error){

    console.error(error);

    box.innerHTML =
    '<div class="error">Usajili umeshindikana: '
    + error.message +
    '</div>';

  }

};


/* =========================
   LOGIN
========================= */

window.login = async function(){

  const username =
    document.getElementById("loginUsername").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const box =
    document.getElementById("loginMessage");

  box.innerHTML="";

  if(!username || !password){

    box.innerHTML =
    '<div class="error">Weka username na password.</div>';

    return;
  }

  try{

    const {data,error} =
      await supabase
      .from("profiles")
      .select("*")
      .eq("username",username)
      .maybeSingle();

    if(error) throw error;

    if(!data){

      box.innerHTML =
      '<div class="error">Username haipo.</div>';

      return;
    }

    const savedPassword =
      localStorage.getItem(
        "kurwa_password_" + username
      );

    if(savedPassword !== password){

      box.innerHTML =
      '<div class="error">Password si sahihi.</div>';

      return;
    }

    currentProfile=data;

    localStorage.setItem(
      "kurwa_current_user",
      username
    );

    openChat();

  }catch(error){

    console.error(error);

    box.innerHTML =
    '<div class="error">' +
    error.message +
    '</div>';

  }

};


/* =========================
   OPEN CHAT
========================= */

function openChat(){

  document.getElementById("auth")
  .classList.add("hidden");

  document.getElementById("chatApp")
  .classList.remove("hidden");

  document.getElementById("currentUser")
  .textContent=currentProfile.username;

}


/* =========================
   START CHAT
========================= */

window.startChat = async function(){

  const username =
    document
    .getElementById("receiverUsername")
    .value.trim();

  const box =
    document.getElementById("chatMessage");

  box.innerHTML="";

  if(!username){

    box.innerHTML =
    '<div class="error">Weka username.</div>';

    return;
  }

  if(username === currentProfile.username){

    box.innerHTML =
    '<div class="error">Huwezi kujitumia ujumbe.</div>';

    return;
  }

  const {data,error} =
    await supabase
    .from("profiles")
    .select("*")
    .eq("username",username)
    .maybeSingle();

  if(error){

    box.innerHTML =
    '<div class="error">' +
    error.message +
    '</div>';

    return;
  }

  if(!data){

    box.innerHTML =
    '<div class="error">Mtumiaji huyo hapatikani.</div>';

    return;
  }

  currentReceiver=data;

  box.innerHTML =
  '<div class="success">Chat na @' +
  data.username +
  ' imefunguliwa.</div>';

  loadMessages();

};


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  if(!currentReceiver) return;

  const {data,error} =
    await supabase
    .from("Message")
    .select("*")
    .or(
      "and(sender_id.eq." +
      currentProfile.id +
      ",receiver_id.eq." +
      currentReceiver.id +
      "),and(sender_id.eq." +
      currentReceiver.id +
      ",receiver_id.eq." +
      currentProfile.id +
      ")"
    )
    .order("created_at",{ascending:true});

  if(error){

    console.error(error);

    document.getElementById("chatArea")
    .innerHTML =
    '<div class="error">' +
    error.message +
    '</div>';

    return;
  }

  const area =
    document.getElementById("chatArea");

  area.innerHTML="";

  data.forEach(msg=>{

    const div=document.createElement("div");

    div.className="msg";

    if(Number(msg.sender_id) ===
       Number(currentProfile.id)){

      div.classList.add("me");

    }

    div.innerHTML =
      escapeHTML(msg.Message) +
      '<div class="small">' +
      new Date(msg.created_at)
      .toLocaleString() +
      '</div>';

    area.appendChild(div);

  });

  area.scrollTop=area.scrollHeight;

}


/* =========================
   SEND MESSAGE
========================= */

window.sendMessage = async function(){

  if(!currentReceiver){

    document.getElementById("chatMessage")
    .innerHTML =
    '<div class="error">Kwanza fungua chat.</div>';

    return;
  }

  const input =
    document.getElementById("messageInput");

  const message=input.value.trim();

  if(!message) return;

  const {error} =
    await supabase
    .from("Message")
    .insert({
      sender_id:currentProfile.id,
      receiver_id:currentReceiver.id,
      Message:message
    });

  if(error){

    document.getElementById("chatMessage")
    .innerHTML =
    '<div class="error">' +
    error.message +
    '</div>';

    console.error(error);

    return;
  }

  input.value="";

  loadMessages();

};


/* =========================
   LOGOUT
========================= */

window.logout=function(){

  currentProfile=null;
  currentReceiver=null;

  document.getElementById("chatApp")
  .classList.add("hidden");

  document.getElementById("auth")
  .classList.remove("hidden");

};


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  const div=document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}


/* =========================
   AUTO LOGIN
========================= */

async function checkUser(){

  const username =
    localStorage.getItem(
      "kurwa_current_user"
    );

  if(!username) return;

  const {data,error} =
    await supabase
    .from("profiles")
    .select("*")
    .eq("username",username)
    .maybeSingle();

  if(!error && data){

    currentProfile=data;

    openChat();

  }

}

checkUser();

</script>

</body>
    </html>
