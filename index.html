// ========================================
// SUPABASE
// ========================================

const SUPABASE_URL =
"https://qodxnlrfxdtqpvctmczw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XVyOJC_mXkCs1wCXd0mIHQ_l-kKaV02";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ========================================
// PHONE NUMBER
// ========================================

function getPhone(countryId, phoneId){

    const country =
        document.getElementById(countryId).value;

    let number =
        document.getElementById(phoneId).value.trim();

    number =
        number.replace(/\s+/g,"");

    // Ondoa + kama mtumiaji ameweka
    number =
        number.replace(/^\+/,"");

    // Ondoa 0 ya mwanzo
    if(number.startsWith("0")){
        number = number.substring(1);
    }

    return country + number;
}


// ========================================
// REGISTER
// ========================================

async function register(){

    const username =
        document
        .getElementById("registerUsername")
        .value
        .trim();

    const phone =
        getPhone(
            "registerCountry",
            "registerPhone"
        );

    const password =
        document
        .getElementById("registerPassword")
        .value;

    const password2 =
        document
        .getElementById("registerPassword2")
        .value;

    const message =
        document.getElementById(
            "registerMessage"
        );


    if(!username || !phone || !password || !password2){

        showMessage(
            message,
            "⚠️ Jaza taarifa zote."
        );

        return;
    }


    if(username.length < 3){

        showMessage(
            message,
            "⚠️ Username iwe na angalau herufi 3."
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            message,
            "⚠️ Password iwe na angalau characters 6."
        );

        return;
    }


    if(password !== password2){

        showMessage(
            message,
            "⚠️ Password hazifanani."
        );

        return;
    }


    try{

        const {data,error} =
            await supabaseClient.auth.signUp({

                phone: phone,

                password: password,

                options:{
                    data:{
                        username:username
                    }
                }

            });


        if(error){

            showMessage(
                message,
                "❌ " + translateError(error.message)
            );

            return;
        }


        showMessage(
            message,
            "✅ Usajili umefanikiwa!"
        );


        setTimeout(() => {

            showLogin();

        },1500);


    }catch(error){

        showMessage(
            message,
            "❌ Kumetokea tatizo. Jaribu tena."
        );

    }

}


// ========================================
// LOGIN
// ========================================

async function login(){

    const phone =
        getPhone(
            "loginCountry",
            "loginPhone"
        );

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const message =
        document.getElementById(
            "loginMessage"
        );


    if(!phone || !password){

        showMessage(
            message,
            "⚠️ Weka namba ya simu na password."
        );

        return;
    }


    try{

        const {data,error} =
            await supabaseClient.auth.signInWithPassword({

                phone:phone,

                password:password

            });


        if(error){

            showMessage(
                message,
                "❌ " + translateError(error.message)
            );

            return;
        }


        showHome(data.user);


    }catch(error){

        showMessage(
            message,
            "❌ Kumetokea tatizo. Jaribu tena."
        );

    }

}


// ========================================
// HOME
// ========================================

function showHome(user){

    document
        .getElementById("loginBox")
        .classList.add("hidden");

    document
        .getElementById("registerBox")
        .classList.add("hidden");

    document
        .getElementById("homeBox")
        .classList
        .remove("hidden");


    const username =
        user.user_metadata?.username ||
        "Mtumiaji";


    document
        .getElementById("userName")
        .innerText =
        "👤 Username: " + username;


}


// ========================================
// LOGOUT
// ========================================

async function logout(){

    await supabaseClient.auth.signOut();

    showLogin();

}


// ========================================
// SHOW REGISTER
// ========================================

function showRegister(){

    document
        .getElementById("loginBox")
        .classList.add("hidden");

    document
        .getElementById("registerBox")
        .classList
        .remove("hidden");

}


// ========================================
// SHOW LOGIN
// ========================================

function showLogin(){

    document
        .getElementById("registerBox")
        .classList.add("hidden");

    document
        .getElementById("homeBox")
        .classList.add("hidden");

    document
        .getElementById("loginBox")
        .classList
        .remove("hidden");

}


// ========================================
// MESSAGE
// ========================================

function showMessage(element,text){

    element.innerText = text;

    element.classList
        .remove("hidden");

}


// ========================================
// ERROR TRANSLATION
// ========================================

function translateError(error){

    const text =
        error.toLowerCase();


    if(text.includes("already registered")){

        return "Namba hii tayari imesajiliwa.";

    }


    if(text.includes("invalid login credentials")){

        return "Namba au password si sahihi.";

    }


    if(text.includes("phone provider is not enabled")){

        return "Phone authentication haijawashwa kwenye Supabase.";

    }


    if(text.includes("rate limit")){

        return "Umejaribu mara nyingi. Subiri kidogo kisha jaribu tena.";

    }


    if(text.includes("password")){

        return "Password uliyoingiza si sahihi.";

    }


    return error;

}


// ========================================
// CHECK EXISTING USER
// ========================================

async function checkUser(){

    const {data} =
        await supabaseClient.auth.getSession();


    if(data.session){

        showHome(
            data.session.user
        );

    }

}


checkUser();

</script></body>
