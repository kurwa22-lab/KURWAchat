<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KURWA CHAT</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f4f7;
}

.header{
    background:#075e54;
    color:white;
    padding:20px;
    text-align:center;
}

.header h1{
    font-size:28px;
}

.header p{
    margin-top:5px;
    opacity:.9;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.card h2{
    margin-bottom:15px;
    color:#075e54;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#075e54;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#064e46;
}

.links{
    text-align:center;
    margin-top:15px;
}

.links a{
    color:#075e54;
    text-decoration:none;
    font-weight:bold;
}

.features{
    margin-top:20px;
}

.feature{
    padding:14px;
    border-bottom:1px solid #eee;
    font-size:16px;
}

.footer{
    text-align:center;
    margin-top:30px;
    padding:20px;
    color:#777;
    font-size:14px;
}
</style>
</head>

<body>

<div class="header">
    <h1>💬 KURWA CHAT</h1>
    <p>Wasiliana na watu kwa urahisi</p>
</div>

<div class="container">

    <div class="card">
        <h2>Ingia KURWA CHAT</h2>

        <input type="text" placeholder="Namba ya simu au username">

        <input type="password" placeholder="Password">

        <button onclick="ingia()">
            INGIA
        </button>

        <div class="links">
            <p>Huna akaunti?</p>
            <a href="#">Jisajili hapa</a>
        </div>
    </div>

    <div class="card features">

        <div class="feature">
            💬 Chat na marafiki
        </div>

        <div class="feature">
            👥 Jiunge na Groups
        </div>

        <div class="feature">
            📸 Tuma picha
        </div>

        <div class="feature">
            🔔 Pata notifications
        </div>

        <div class="feature">
            🔍 Tafuta watu
        </div>

    </div>

</div>

<div class="footer">
    © 2026 KURWA CHAT
</div>

<script>

function ingia(){

    alert("Karibu KURWA CHAT! 🚀");

}

</script>

</body>
</html>
